<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini API 密钥测试工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2d3748;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            font-weight: 500;
        }
        .success {
            background: #f0fff4;
            border: 2px solid #68d391;
            color: #22543d;
        }
        .error {
            background: #fed7d7;
            border: 2px solid #fc8181;
            color: #742a2a;
        }
        .info {
            background: #ebf8ff;
            border: 2px solid #63b3ed;
            color: #2a4365;
        }
        .loading {
            text-align: center;
            color: #667eea;
        }
        .tips {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
        }
        .tips h3 {
            margin-top: 0;
            color: #2d3748;
        }
        .tips ul {
            margin: 0;
            padding-left: 20px;
        }
        .tips li {
            margin-bottom: 8px;
            color: #4a5568;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Gemini API 密钥测试工具</h1>
        
        <div class="form-group">
            <label for="apiKey">输入你的 Gemini API 密钥:</label>
            <input type="text" id="apiKey" placeholder="AIzaSyC..." maxlength="39">
        </div>
        
        <button onclick="testApiKey()" id="testBtn">🧪 测试 API 密钥</button>
        
        <div id="result"></div>
        
        <div class="tips">
            <h3>💡 使用提示</h3>
            <ul>
                <li>Gemini API 密钥应该是39个字符，以 "AIza" 开头</li>
                <li>如果在中国大陆，可能需要使用VPN</li>
                <li>确保在 <a href="https://console.cloud.google.com/" target="_blank">Google Cloud Console</a> 中启用了 Generative Language API</li>
                <li>API 密钥可以在 <a href="https://makersuite.google.com/app/apikey" target="_blank">AI Studio</a> 中获取</li>
            </ul>
        </div>
    </div>

    <script>
        async function testApiKey() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const resultDiv = document.getElementById('result');
            const testBtn = document.getElementById('testBtn');
            
            if (!apiKey) {
                showResult('请输入 API 密钥', 'error');
                return;
            }
            
            // 禁用按钮并显示加载状态
            testBtn.disabled = true;
            testBtn.textContent = '🔄 测试中...';
            showResult('正在验证 API 密钥...', 'loading');
            
            try {
                // 基本格式检查
                const formatCheck = checkApiKeyFormat(apiKey);
                if (!formatCheck.valid) {
                    showResult(formatCheck.error, 'error');
                    return;
                }
                
                // API 调用测试
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: 'Hello'
                                }]
                            }],
                            generationConfig: {
                                temperature: 0.1,
                                topK: 1,
                                topP: 1,
                                maxOutputTokens: 10
                            }
                        })
                    }
                );
                
                if (response.ok) {
                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '无响应内容';
                    showResult(`✅ API 密钥有效！\n\n测试响应: "${text}"`, 'success');
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    const errorMessage = errorData.error?.message || '未知错误';
                    
                    let detailedError = '';
                    switch (response.status) {
                        case 400:
                            detailedError = `请求格式错误: ${errorMessage}`;
                            break;
                        case 403:
                            detailedError = `API 密钥无效或权限不足\n\n可能的原因:\n• API 密钥错误\n• API 未启用\n• 地区限制（需要VPN）\n• 账户被限制`;
                            break;
                        case 429:
                            detailedError = `API 调用频率超限，请稍后重试`;
                            break;
                        case 503:
                            detailedError = `API 服务暂时不可用，请稍后重试`;
                            break;
                        default:
                            detailedError = `API 调用失败 (${response.status}): ${errorMessage}`;
                    }
                    
                    showResult(`❌ ${detailedError}`, 'error');
                }
                
            } catch (error) {
                let errorMsg = '网络连接失败';
                if (error.name === 'TypeError') {
                    errorMsg += '\n\n可能的原因:\n• 网络连接问题\n• 防火墙阻止\n• 需要使用VPN\n• CORS 策略限制';
                }
                showResult(`❌ ${errorMsg}`, 'error');
            } finally {
                // 恢复按钮状态
                testBtn.disabled = false;
                testBtn.textContent = '🧪 测试 API 密钥';
            }
        }
        
        function checkApiKeyFormat(apiKey) {
            if (apiKey.length !== 39) {
                return {
                    valid: false,
                    error: `API 密钥长度错误: ${apiKey.length} 个字符（应为39个字符）`
                };
            }
            
            if (!apiKey.startsWith('AIza')) {
                return {
                    valid: false,
                    error: 'API 密钥格式错误: 应以 "AIza" 开头'
                };
            }
            
            if (!/^[A-Za-z0-9_-]+$/.test(apiKey)) {
                return {
                    valid: false,
                    error: 'API 密钥包含非法字符'
                };
            }
            
            return { valid: true };
        }
        
        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${type}`;
            resultDiv.textContent = message;
            resultDiv.style.display = 'block';
        }
        
        // 监听回车键
        document.getElementById('apiKey').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                testApiKey();
            }
        });
    </script>
</body>
</html>
